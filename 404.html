<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Aman Kumar Studio</title>
  
  <script>
    // Smart recovery for extensionless or trailing slash routing on GitHub Pages
    (function () {
      var path = window.location.pathname;
      // Handle trailing slash on /nexus/ -> /nexus
      if (/\/nexus\/?$/.test(path)) {
        var base = path.replace(/\/nexus\/?$/, '/nexus');
        window.location.replace(base + window.location.search + window.location.hash);
        return;
      }
      if (/\/inquiries\/?$/.test(path)) {
        var baseInq = path.replace(/\/inquiries\/?$/, '/inquiries');
        window.location.replace(baseInq + window.location.search + window.location.hash);
        return;
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=6.0" />

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      background: var(--bg, #F8F5EE);
      color: var(--ink, #111215);
      font-family: 'Space Grotesk', sans-serif;
    }
    .err-code {
      font-family: 'Clash Display', sans-serif;
      font-size: clamp(80px, 16vw, 180px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--acc, #FF451A);
      margin-bottom: 12px;
    }
    .err-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(28px, 5vw, 48px);
      font-style: italic;
      font-weight: 400;
      margin-bottom: 16px;
    }
    .err-desc {
      max-width: 440px;
      font-size: 15px;
      color: var(--ink-dim, #555860);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .err-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--acc, #FF451A);
      color: var(--acc-contrast, #FFFFFF);
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .err-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(255, 69, 26, 0.25);
    }
  </style>
</head>
<body>
  <div class="err-code">404</div>
  <h1 class="err-title">Coordinates out of bounds</h1>
  <p class="err-desc">
    The digital surface or document you are seeking has been moved, archived, or decommissioned from this vector.
  </p>
  <a href="./" class="err-btn">
    <span>← Return to Studio Portfolio</span>
  </a>
</body>
</html>
